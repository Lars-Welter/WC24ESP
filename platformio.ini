; PlatformIO Project Configuration File
;
; Wordclock 24h firmware for the BTF-LIGHTING SP803E (ESP32) LED controller.
;
; Build and flash:
;   pio run -e SP803E -t upload
;
; The SP803E carries an ESP32-WROOM-32 with 4 MB flash and is flashed over its
; USB-C port (CH340 UART). The stock WLED firmware is overwritten completely,
; the erase_before_upload.py script wipes the flash first so no WLED settings
; are left behind.

[platformio]
default_envs = SP803E

[env:SP803E]
platform = espressif32 @ 6.9.0
board = esp32dev
framework = arduino
board_build.partitions = min_spiffs.csv
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -Os
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
lib_deps =
    makuna/NeoPixelBus@^2.7.6
    bblanchon/ArduinoJson@^6.17.2
    links2004/WebSockets@2.4.1
    adafruit/RTClib@^1.11.2
    knolleary/PubSubClient@^2.8.0
    https://github.com/tzapu/WiFiManager#b67b7828b9192fcbbc3f723c15b2bfa83e6a22fd
    claws/BH1750@^1.3.0
extra_scripts =
    pre:extra_scripts.py
    post:erase_before_upload.py
